name: stove_transaction
description: ACSL Sales Monitoring App for ACSL agents and partner agents.

publish_to: "none"

version: 1.0.12+10012

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  get: ^4.6.5 # being removed — kept during Riverpod migration (see docs/flutter.md)
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  http: ^1.2.1
  http_parser: ^4.0.2
  signature: ^5.3.0
  uuid: ^4.1.0
  flutter_svg: ^2.0.9
  google_fonts: ^4.0.4
  intl: ^0.20.2
  camera: ^0.11.0+2
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.0
  image_picker: ^1.0.2
  get_storage: ^2.1.1
  supabase_flutter: ^2.9.1
  logger: ^2.6.0
  toastification: ^2.3.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_image_compress: ^2.3.0
  path: ^1.8.3
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  share_plus: ^11.1.0
  sqflite: ^2.3.0
  connectivity_plus: ^6.1.0
  fl_chart: ^0.69.0
  google_maps_flutter: ^2.6.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - assets/images/
    - assets/images/splash/
    - assets/icons/
    - assets/icons/app/
    - .env
