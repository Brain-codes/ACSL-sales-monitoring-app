org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier disabled: every dependency here is already AndroidX, so the legacy
# support-lib rewrite isn't needed — and its JetifyTransform was OOM-ing the CI
# runner ("Java heap space") on the Flutter native-lib jars. Removing it also
# speeds the build. Re-enable only if a truly legacy (non-AndroidX) lib is added.
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
